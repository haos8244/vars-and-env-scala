name: Scala Tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: sbt
      - uses: sbt/setup-sbt@v1
      - name: Run tests (excluding capstone)
        run: sbt "testOnly problem1.* problem2.* problem3.* problem4.* problem5.* problem6.* problem7.* problem8.*"
